<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Spatial Echo | Identity Selection</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --paper: #f2eee3; --ink: #1a1a1a; --texture: url('https://www.transparenttextures.com/patterns/cream-paper.png'); }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #d9d4c7; font-family: 'Space Mono', monospace; display: flex; align-items: center; justify-content: center; }
        
        /* THE FOLDER: Now at 75% width */
        .folder { 
            position: relative; 
            width: 75%; /* Unified Width */
            max-width: 320px; 
            height: 75vh; 
            background: var(--paper); 
            background-image: var(--texture); 
            border-radius: 0 15px 15px 15px; 
            box-shadow: 20px 20px 60px rgba(0,0,0,0.15); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 30px 20px; 
            box-sizing: border-box; 
        }
        /* Left Tab (Fixed) */
        .tab-left { position: absolute; left: -26px; top: 40px; width: 26px; height: 160px; background: var(--paper); border-radius: 12px 0 0 12px; display: flex; align-items: center; justify-content: center; opacity: 0.4; pointer-events: none; margin-left: -1px; }
        .tab-left-text { transform: rotate(-90deg); white-space: nowrap; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--ink); text-transform: uppercase; }

        /* Right Tabs Container */
        .tabs-right { 
            position: absolute; 
            right: 0; 
            top: 60px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        /* FIXED: Tabs are smaller (width 26px) and have negative margin to snap to outer edge */
        .echo-tab { 
            width: 26px; 
            height: 80px; 
            background: #e6e2d6; 
            border-radius: 0 10px 10px 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            writing-mode: vertical-rl; 
            text-orientation: mixed; 
            font-size: 9px; 
            font-weight: 700; 
            color: var(--ink); 
            border: 1px solid rgba(0,0,0,0.08); 
            border-left: none;
            margin-right: -26px; /* Snaps to outer edge */
            transition: margin-right 0.2s;
        }
        
        /* FIXED: Active tab pops out, still safe within the 75% boundary */
        .echo-tab.active { 
            background: #dcd8cc; 
            margin-right: -32px; /* Pops out further */
        }

        .camera-window { width: 100%; aspect-ratio: 3 / 4; background: #000; border: 1px solid rgba(0,0,0,0.1); overflow: hidden; margin-bottom: 25px; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }

        .content-area { text-align: left; width: 100%; }
        .label { font-size: 9px; font-weight: 700; color: var(--ink); margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; border-bottom: 1.5px solid rgba(0,0,0,0.1); padding-bottom: 4px; display: inline-block; }
        .teaser { font-size: 11px; line-height: 1.6; border-left: 3px solid var(--ink); padding-left: 12px; margin-bottom: 20px; min-height: 85px; color: var(--ink); }

        /* FIXED: Button text color is now black (--ink) */
        .unfold-btn { 
            width: 100%; 
            border: 1.5px solid var(--ink); 
            padding: 12px; 
            font-family: inherit; 
            font-size: 12px; 
            font-weight: 700; 
            text-transform: uppercase; 
            color: var(--ink); /* Fixed Color */
            background: none;
            cursor: pointer;
        }
        
        #loading { position: absolute; inset: 0; background: var(--paper); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 0 15px 15px 15px; }
        .spinner { width: 25px; height: 25px; border: 2px solid var(--ink); border-top-color: transparent; border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="folder">
        <div class="tab-left"><div class="tab-left-text">Spatial Echo</div></div>
        <div class="tabs-right" id="tabs-container"></div>
        <div class="camera-window"><video id="camera-feed" autoplay playsinline></video></div>
        <div class="content-area">
            <p class="label" id="echo-title">Detecting...</p>
            <div class="teaser" id="echo-teaser">Recalibrating spatial consciousness...</div>
            <button class="unfold-btn" onclick="window.location.href='index3.html'">Unfold Act</button>
        </div>
        <div id="loading"><div class="spinner"></div><p style="margin-top:15px; font-size:9px;">SYNCING LOCALITY...</p></div>
    </div>

<script>
    // =====================================================================
    // CONFIG — Replace with your real keys
    // =====================================================================
    const GEMINI_API_KEY  = "YOUR_GEMINI_API_KEY";
    const GOOGLE_MAPS_KEY = "YOUR_GOOGLE_MAPS_API_KEY";

    const video = document.getElementById('camera-feed');
    navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(s=>{video.srcObject=s;});

    const loadingText = document.querySelector('#loading p');

    // =====================================================================
    // HARDCODED ARCHIVE — Known cities
    // =====================================================================
    const archiveDatabase = {
        Berkeley: [
            { tab: "1942", title: "OPPENHEIMER'S OFFICE", role: "THE PHYSICIST", act1: "<b>YOU ARE J. ROBERT OPPENHEIMER.</b> The equations for the Manhattan Project are nearly complete. <b>YOU ARE GOING TO WALK PAST THE CAMPANILE.</b> Keep your head down; the theory depends on your silence.", act2: "<b>ARRIVED AT LECONTE HALL.</b> Look at the tower. You are witnessing the watershed of human power." },
            { tab: "1964", title: "FREE SPEECH MOVEMENT", role: "THE PROTESTER", act1: "<b>YOU ARE A STUDENT AT BERKELEY.</b> Mario Savio has just climbed onto the police car. <b>YOU ARE GOING TO WALK TOWARD THE STEPS.</b> Refuse to move until they hear you.", act2: "<b>ARRIVED AT SPROUL HALL STEPS.</b> Stop and feel the power. Sit down; your silence is the loudest speech of all." },
            { tab: "1967", title: "THE GRADUATE (SET)", role: "THE ACTOR", act1: "<b>YOU ARE DUSTIN HOFFMAN.</b> It's 1967, Scene 14. <b>YOU ARE GOING TO WALK ACROSS STRAWBERRY CREEK</b> repeatedly until the director is satisfied.", act2: "<b>ARRIVED AT FACULTY CLUB BRIDGE.</b> Embrace the alienation. You aren't just an actor; you are a drifter." }
        ],
        SanFrancisco: [
            { tab: "1958", title: "VERTIGO (SCENE 22)", role: "THE DETECTIVE", act1: "<b>YOU ARE SCOTTIE FERGUSON.</b> Madeleine is walking toward the water. You can't stop following her. <b>YOU ARE GOING TO WALK ALONG MARINE DRIVE.</b> The fog is Hitchcock's direction; trust it.", act2: "<b>ARRIVED UNDER THE BRIDGE.</b> Look up at the rust-red cables. The vertigo isn't the height — it's the obsession pulling you forward." },
            { tab: "1967", title: "SUMMER OF LOVE", role: "THE DRIFTER", act1: "<b>YOU ARE A STRANGER WHO JUST ARRIVED IN HAIGHT-ASHBURY.</b> Someone hands you a flower. <b>YOU ARE GOING TO WALK TOWARD GOLDEN GATE PARK.</b> The revolution smells like patchouli and possibility.", act2: "<b>ARRIVED AT ALVORD LAKE.</b> Sit on the grass. You are not protesting anything — you are simply refusing to leave." },
            { tab: "1906", title: "THE GREAT QUAKE", role: "THE SURVIVOR", act1: "<b>YOU ARE A CLERK AT THE PALACE HOTEL.</b> It is 5:12 AM, April 18th. The floor has just shifted. <b>YOU ARE GOING TO WALK DOWN MARKET STREET.</b> Stay close to the center; the facades are falling.", act2: "<b>ARRIVED AT THE PALACE HOTEL.</b> Touch the wall. This building burned and was rebuilt. So were you." }
        ],
        NewYork: [
            { tab: "1922", title: "THE GATSBY PARTY", role: "THE GUEST", act1: "<b>YOU ARE AN UNINVITED GUEST AT GATSBY'S PARTY.</b> The jazz is deafening and the champagne is endless. <b>YOU ARE GOING TO WALK ALONG THE HUDSON.</b> Look east — the green light is not for you.", act2: "<b>ARRIVED AT THE PIER'S EDGE.</b> Stand still. Gatsby believed in the green light. You believe in the echo of it." },
            { tab: "1945", title: "V-J DAY IN TIMES SQ", role: "THE SAILOR", act1: "<b>YOU ARE A SAILOR ON LEAVE.</b> Japan has surrendered. The entire city is screaming. <b>YOU ARE GOING TO WALK INTO TIMES SQUARE.</b> Every stranger is your best friend today.", act2: "<b>ARRIVED AT 45TH & BROADWAY.</b> Stop in the middle of the crowd. History is being photographed around you, but you are living it." },
            { tab: "1977", title: "THE BLACKOUT", role: "THE WITNESS", act1: "<b>YOU ARE A COMMUTER STRANDED IN GRAND CENTRAL.</b> The lights just died. All of Manhattan is dark. <b>YOU ARE GOING TO WALK INTO THE TERMINAL.</b> Listen — the city is louder without electricity.", act2: "<b>ARRIVED IN THE SHADOWS OF 42ND ST.</b> Look up. Without the lights, you can almost see the stars over Manhattan." }
        ],
        LosAngeles: [
            { tab: "1952", title: "SINGIN' IN THE RAIN", role: "THE PERFORMER", act1: "<b>YOU ARE GENE KELLY, TAKE 7.</b> The rain machines are soaking through your suit. You don't care. <b>YOU ARE GOING TO WALK THROUGH THE STUDIO LOT.</b> Smile — the camera is always rolling.", act2: "<b>ARRIVED AT THE FAMOUS LAMP POST.</b> Grab it. Swing. The puddles are your stage and the rain is your applause." },
            { tab: "1923", title: "HOLLYWOODLAND", role: "THE DREAMER", act1: "<b>YOU ARE A REAL ESTATE DEVELOPER IN 1923.</b> The sign on the hill says HOLLYWOODLAND. <b>YOU ARE GOING TO WALK UP BEACHWOOD CANYON.</b> You are selling a fantasy before cinema even learns to talk.", act2: "<b>ARRIVED AT MOUNT LEE BASE.</b> Look up at the letters. Four of them will be torn down. The dream will only get bigger." },
            { tab: "2019", title: "BLADE RUNNER SET", role: "THE REPLICANT", act1: "<b>YOU ARE A REPLICANT WHO DOESN'T KNOW IT YET.</b> The neon reflects off wet pavement. <b>YOU ARE GOING TO WALK DOWN 3RD & BROADWAY.</b> Count the floors of the Bradbury Building. Your memories may not be yours.", act2: "<b>ARRIVED AT THE BRADBURY INTERIOR.</b> Look up through the iron lattice. The light falling through is the oldest thing in this city." }
        ],
        GoogleNY: [
            { tab: "1936", title: "THE INDOOR RAILWAY", role: "THE CONDUCTOR", act1: "<b>YOU ARE A FREIGHT CONDUCTOR IN 1936.</b> This building was the Port Authority Inland Terminal. Trains ran through its belly. <b>YOU ARE GOING TO WALK THROUGH THE LOBBY.</b> The rails are buried under server racks now.", act2: "<b>ARRIVED AT THE FREIGHT ELEVATORS.</b> These lifts once moved cargo from the High Line. Now they move engineers. The ghosts of locomotives idle here." }
        ],
        GoogleMV: [
            { tab: "1998", title: "THE GARAGE STARTUP", role: "THE FOUNDER", act1: "<b>YOU ARE IN SUSAN WOJCICKI'S GARAGE.</b> It is September 1998. Two Stanford dropouts just rented your garage for $1,700. <b>YOU ARE GOING TO WALK TO THE GARAGE.</b> The search engine doesn't even have a logo yet.", act2: "<b>ARRIVED AT THE GOOGLEPLEX CORE.</b> Look around. All of this grew from a single rental check and a better sorting algorithm." }
        ]
    };

    // =====================================================================
    // GEO-FENCES
    // =====================================================================
    const geoFences = [
        [37.85,  37.90, -122.30, -122.23, "Berkeley"],
        [37.70,  37.84, -122.52, -122.38, "SanFrancisco"],
        [40.70,  40.80, -74.02,  -73.93,  "NewYork"],
        [33.90,  34.20, -118.40, -118.20, "LosAngeles"],
        [40.738, 40.745,-74.008, -74.000, "GoogleNY"],
        [37.41,  37.43, -122.09, -122.07, "GoogleMV"],
    ];

    function detectRegion(lat, lon) {
        for (const [latMin, latMax, lonMin, lonMax, key] of geoFences) {
            if (lat >= latMin && lat <= latMax && lon >= lonMin && lon <= lonMax) return key;
        }
        return "General";
    }

    // =====================================================================
    // GOOGLE PLACES — dynamically load SDK, find nearby POIs
    // =====================================================================
    function loadGoogleMapsAPI() {
        return new Promise((resolve, reject) => {
            if (window.google && window.google.maps && window.google.maps.places) {
                resolve(); return;
            }
            const script = document.createElement('script');
            script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_KEY}&libraries=places`;
            script.onload  = resolve;
            script.onerror = reject;
            document.head.appendChild(script);
        });
    }

    function findNearbyPlaces(lat, lon) {
        return new Promise((resolve) => {
            const svc = new google.maps.places.PlacesService(document.createElement('div'));
            svc.nearbySearch({
                location: new google.maps.LatLng(lat, lon),
                radius: 1500,
                keyword: "historical landmark monument memorial museum heritage"
            }, (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK && results.length) {
                    // Deduplicate & prefer high-rated, take top 5 candidates for Gemini to pick from
                    const sorted = results
                        .filter(r => r.name && r.geometry)
                        .sort((a, b) => (b.rating || 0) - (a.rating || 0));
                    resolve(sorted.slice(0, 5));
                } else {
                    resolve([]);
                }
            });
        });
    }

    // =====================================================================
    // GEMINI — generate stories from nearby places
    // =====================================================================
    async function generateStories(places, userLat, userLon) {
        const placesPayload = places.map(p => ({
            name: p.name,
            address: p.vicinity || "",
            lat: p.geometry.location.lat(),
            lon: p.geometry.location.lng(),
            types: (p.types || []).join(", ")
        }));

        const prompt = `You are the writer for "Spatial Echo", an immersive GPS walking experience. The user is at latitude ${userLat}, longitude ${userLon}.

Here are nearby places found by Google Places:
${JSON.stringify(placesPayload, null, 2)}

Pick 1 to 3 of the MOST historically or culturally interesting places. For each, create a story object. Research or infer what real historical event, famous person, or cultural moment is connected to that place or its neighborhood.

Each story object MUST have these exact fields:
- "tab": a 4-character label — a year like "1923" or a code like "ARCHV"
- "title": ALL-CAPS title, max 30 characters (this is used as a unique key)
- "role": format "THE [ROLE]" in all caps, e.g. "THE DETECTIVE"
- "act1": the walking phase. Use <b> tags for emphasis. Start with "<b>YOU ARE [CHARACTER].</b>" then a 1-2 sentence scene-setter, then "<b>YOU ARE GOING TO WALK TOWARD [PLACE NAME].</b>" then a 1-sentence poetic instruction. ~50 words total.
- "act2": the arrival phase. Start with "<b>ARRIVED AT [LANDMARK].</b>" then 2 sentences of reflection. ~30 words total.
- "waypoints": an array of exactly 2 objects, each with "lat" (number), "lon" (number), "name" (string). The first waypoint is ~100-200m from the user toward the place. The second waypoint is the place itself. Use the real coordinates from the places data.

STYLE REFERENCE (match this voice exactly):
{ "tab": "1964", "title": "FREE SPEECH MOVEMENT", "role": "THE PROTESTER", "act1": "<b>YOU ARE A STUDENT AT BERKELEY.</b> Mario Savio has just climbed onto the police car. <b>YOU ARE GOING TO WALK TOWARD THE STEPS.</b> Refuse to move until they hear you.", "act2": "<b>ARRIVED AT SPROUL HALL STEPS.</b> Stop and feel the power. Sit down; your silence is the loudest speech of all." }

Respond with ONLY a valid JSON array. No markdown fences, no explanation, no preamble.`;

        const resp = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
            {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: { temperature: 0.9, maxOutputTokens: 2048 }
                })
            }
        );

        const data = await resp.json();
        const raw  = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
        // Strip markdown fences if Gemini wraps them anyway
        const cleaned = raw.replace(/```json\s*/gi, "").replace(/```\s*/gi, "").trim();
        return JSON.parse(cleaned);
    }

    // =====================================================================
    // MAIN LOADER
    // =====================================================================
    async function loadContext() {
        localStorage.clear();

        let lat, lon;
        try {
            const pos = await new Promise((res, rej) =>
                navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true })
            );
            lat = pos.coords.latitude;
            lon = pos.coords.longitude;
        } catch (e) {
            // Geolocation failed — show hardcoded General fallback
            render(fallbackGeneral());
            document.getElementById('loading').style.display = 'none';
            return;
        }

        const region = detectRegion(lat, lon);

        if (region !== "General") {
            // Known city — use hardcoded stories
            render(archiveDatabase[region]);
            document.getElementById('loading').style.display = 'none';
            return;
        }

        // ---- GENERAL: dynamic generation pipeline ----
        try {
            loadingText.textContent = "SCANNING NEARBY ECHOES...";
            await loadGoogleMapsAPI();

            loadingText.textContent = "SEARCHING FOR GHOSTS...";
            const places = await findNearbyPlaces(lat, lon);

            if (places.length === 0) throw new Error("No places found");

            loadingText.textContent = "GENERATING STORIES...";
            const stories = await generateStories(places, lat, lon);

            if (!Array.isArray(stories) || stories.length === 0) throw new Error("Bad Gemini response");

            // Validate & sanitize each story
            const valid = stories.filter(s => s.tab && s.title && s.role && s.act1 && s.act2 && s.waypoints?.length === 2);
            if (valid.length === 0) throw new Error("No valid stories");

            render(valid);
        } catch (err) {
            console.warn("Dynamic generation failed, using fallback:", err);
            render(fallbackGeneral());
        }

        document.getElementById('loading').style.display = 'none';
    }

    // Static fallback if APIs fail
    function fallbackGeneral() {
        return [
            { tab: "ARCHV", title: "Historical Fragment", role: "THE CHRONICLER", act1: "<b>YOU ARE A TEMPORAL CHRONICLER.</b> The archive has detected a resonance nearby. <b>YOU ARE GOING TO EXTRACT THE STORY.</b> Observe the architectural patterns.", act2: "<b>ARRIVED AT THE CORE.</b> Observe the oldest structure nearby. You are extracting the phantom memory." },
            { tab: "FILM", title: "Uncut Cinema", role: "THE CINEMATOGRAPHER", act1: "<b>YOU ARE A DIRECTOR IN SEARCH OF A LOCATION.</b> <b>YOU ARE GOING TO SCOUT THE SCENE.</b> Find where the shadow hits the pavement.", act2: "<b>SET REACHED.</b> Feel the black-and-white texture. You aren't a tourist; you are filming a masterpiece." }
        ];
    }

    // =====================================================================
    // RENDER
    // =====================================================================
    function render(data) {
        const container = document.getElementById('tabs-container');
        container.innerHTML = "";
        data.forEach((echo, index) => {
            const div = document.createElement('div');
            div.className = `echo-tab ${index === 0 ? 'active' : ''}`;
            div.innerText = echo.tab;
            div.onclick = (e) => {
                document.querySelectorAll('.echo-tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById('echo-title').innerText = echo.title;
                document.getElementById('echo-teaser').innerHTML = echo.act1;
                localStorage.setItem('selectedStory', JSON.stringify(echo));
            };
            container.appendChild(div);
        });
        document.getElementById('echo-title').innerText = data[0].title;
        document.getElementById('echo-teaser').innerHTML = data[0].act1;
        localStorage.setItem('selectedStory', JSON.stringify(data[0]));
    }

    loadContext();
</script>
</body>
</html>
